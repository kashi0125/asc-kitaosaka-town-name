:root{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:var(--dot)}
.chip .pct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.74rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.72rem;letter-spacing:.14em;color:var(--muted);font-weight:700}
.plate{align-self:center;background:var(--plate);color:var(--plate-ink);border-radius:6px;padding:10px 26px 12px;box-shadow:inset 0 0 0 3px var(--plate),inset 0 0 0 5px rgba(255,255,255,.75);text-align:center;min-width:60%}
.plate .nm{font-family:var(--display);font-weight:900;font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.2;letter-spacing:.06em;word-break:keep-all}
.plate .sub{font-size:.75rem;opacity:.85;letter-spacing:.1em}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:12px 8px;font:700 1.02rem var(--display);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}
.opt i{width:10px;height:10px;border-radius:50%;background:var(--cc);flex:none}
.opt:hover{border-color:var(--muted)}
.opt:focus-visible,.chip:focus-visible,.tabs button:focus-visible,.next:focus-visible,.row:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 12%,var(--surface))}
.opt:disabled{cursor:default}
.opt.skip{grid-column:1/-1;min-height:44px;font-size:.92rem;color:var(--muted);border-style:dashed;background:transparent}
.opt.skip.picked{border-style:solid;border-color:var(--muted);color:var(--ink)}

.fb.ok{color:var(--ok)} .fb.ng{color:var(--ng)}

.tog{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer}
.map text{font-family:var(--display);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:3px}

</style>
</head>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let last=null,cur=null;
function score(t,ok){const r=rec[t.id]||[0,0];rec[t.id]=ok?[r[0]+1,r[1]]:[0,r[1]+1];store.set("kd-rec",rec);session.n++;if(ok)session.ok++;renderChips();renderStat()}

function newQ(){
  const P=pool();$("fb").textContent="";$("fb").className="fb";$("next").hidden=true;
  if(!P.length){$("gmap").hidden=true;$("qName").textContent="範囲を選んでください";$("qSub").textContent="";$("opts").innerHTML="";$("qMap").setAttribute("hidden","");return}
  let t;do{t=pick(P)}while(P.length>1&&t===last);last=cur=t;$("gmap").hidden=true;
  const pl=$("plate");pl.classList.add("pop");setTimeout(()=>pl.classList.remove("pop"),150);
  const o=$("opts");o.innerHTML="";
  if(mode==="city"){
    $("qLabel").textContent="この町はどこの市町？";$("plate").hidden=false;$("qName").textContent=t.name;$("qSub").textContent="町名";$("qMap").setAttribute("hidden","");
    CITIES.forEach((c,i)=>{const b=document.createElement("button");b.className="opt";b.style.setProperty("--cc",col(i));b.innerHTML=`<i></i>${c}`;b.onclick=()=>answerCity(i,b);o.appendChild(b)});
    addSkip(o);
  }else{
    $("qLabel").textContent=`地図の◎の場所はどの町？（${CITIES[t.city]}の中から）`;$("plate").hidden=true;$("qMap").removeAttribute("hidden");drawMap($("qMap"),t.city,t);
    const same=TOWNS.filter(x=>x.city===t.city&&x!==t&&x.name!==t.name);
    // prefer nearby towns as distractors
    const dist=(a,b)=>Math.hypot((a.lat-b.lat),(a.lng-b.lng)*kx);
    let near;
    if(nearOpt){same.sort((a,b)=>dist(a,t)-dist(b,t));near=shuffle(same.slice(0,8)).slice(0,3)}
    else{ // spread out: every option far from the answer and from each other
      const all=[t,...same];let span=0;all.forEach(a=>all.forEach(b=>{span=Math.max(span,dist(a,b))}));
      for(let D=span*0.3;;D*=0.8){near=[];for(const c of shuffle(same.slice())){if([t,...near].every(x=>dist(x,c)>=D))near.push(c);if(near.length===3)break}
        if(near.length===3||D<1e-4||same.length<3)break}
      near=near.slice(0,3)}
    shuffle([t,...near]).forEach(x=>{const b=document.createElement("button");b.className="opt";b.textContent=x.name;b.onclick=()=>answerMap(x,b);b._t=x;o.appendChild(b)});
    addSkip(o);
  }
}
function addSkip(o){const b=document.createElement("button");b.className="opt skip";b.textContent="わからない";b.onclick=()=>skip(b);o.appendChild(b)}
function skip(b){const t=cur;score(t,false);b.classList.add("picked");
  if(mode==="city"){const okSet=BY_NAME[t.name];[...$("opts").children].forEach((x,j)=>{if(okSet.has(j))x.classList.add("ok")});
    finish(false,`正解は ${t.name}＝${[...okSet].map(j=>CITIES[j]).join("・")}`);$("qMap").removeAttribute("hidden");drawMap($("qMap"),null,Object.assign({},t,{showName:true}));}
  else{[...$("opts").children].forEach(y=>{if(y._t===t)y.classList.add("ok")});drawMap($("qMap"),t.city,Object.assign({},t,{showName:true}));finish(false,`正解は「${t.name}」`)}}
const fullCity=i=>(CITIES[i]==="島本町"?"三島郡島本町":CITIES[i]);
function gmapURL(t,reveal){return reveal?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("大阪府"+fullCity(t.city)+t.name):"https://www.google.com/maps/search/?api=1&query="+t.lat+","+t.lng}
function setGmap(t,reveal){$("gmap").href=gmapURL(t,reveal);$("gmapNote").textContent=t.name+"を確認"}
function finish(ok,msg){setGmap(cur,true);$("gmap").hidden=false;$("fb").textContent=msg;$("fb").className="fb "+(ok?"ok":"ng");document.querySelectorAll(".opt").forEach(b=>b.disabled=true);$("next").hidden=false;$("next").focus({preventScroll:true})}
function answerCity(i,b){const t=cur;const okSet=BY_NAME[t.name];const ok=okSet.has(i);
  score(t,ok);[...$("opts").children].forEach((x,j)=>{if(okSet.has(j))x.classList.add("ok")});if(!ok)b.classList.add("ng");
  const others=[...okSet].filter(j=>j!==t.city).map(j=>CITIES[j]);
  finish(ok,(ok?"正解！ ":"ざんねん… ")+`${t.name}は${[...okSet].map(j=>CITIES[j]).join("・")}`+(others.length?"（同名あり）":""));
  $("qMap").removeAttribute("hidden");drawMap($("qMap"),null,Object.assign({},t,{showName:true}));}
function answerMap(x,b){const t=cur;const ok=x===t;score(t,ok);
  [...$("opts").children].forEach(y=>{if(y._t===t)y.classList.add("ok")});if(!ok)b.classList.add("ng");
  drawMap($("qMap"),t.city,Object.assign({},t,{showName:true}));
  finish(ok,ok?"正解！":`ざんねん… 正解は「${t.name}」`)}

function renderChips(){const el=$("chips");el.innerHTML="";CITIES.forEach((c,i)=>{const ts=TOWNS.filter(t=>t.city===i);const p=Math.round(100*ts.filter(learned).length/ts.length);
  const b=document.createElement("button");b.className="chip";b.style.setProperty("--cc",col(i));b.setAttribute("aria-pressed",scope[i]);b.innerHTML=`<i></i>${c}<span class="pct">${ts.length}町 ${p}%</span>`;
  b.onclick=()=>{if(mode==="list"){listCity=i;store.set("kd-listcity",i);renderList();return}scope[i]=!scope[i];store.set("kd-scope",scope);renderChips();if(mode!=="list")newQ()};el.appendChild(b)});
  if(mode==="list")[...el.children].forEach((b,i)=>b.setAttribute("aria-pressed",i===listCity))}
function renderStat(){const L=TOWNS.filter(learned).length;$("stat").textContent=`覚えた ${L}/${TOWNS.length}　今回 ${session.ok}/${session.n}`}

let nearOpt=store.get("kd-near",false);$("nearOpt").checked=nearOpt;
$("nearOpt").onchange=e=>{nearOpt=e.target.checked;store.set("kd-near",nearOpt);if($("next").hidden)newQ()};
let sel=null;let showLabels=store.get("kd-labels",true);$("labels").checked=showLabels;
$("labels").onchange=e=>{showLabels=e.target.checked;store.set("kd-labels",showLabels);renderList()};
$("lMap").addEventListener("click",e=>{const c=$("lMap")._ctx;if(!c||!c.ts.length)return;const r=$("lMap").getBoundingClientRect();const x=(e.clientX-r.left)*c.pr.W/r.width,y=(e.clientY-r.top)*c.pr.H/r.height;
  let bi=0,bd=1e9;c.P.forEach(([px,py],i)=>{const d=(px-x)**2+(py-y)**2;if(d<bd){bd=d;bi=i}});sel=c.ts[bi];renderList();
  const cur=document.querySelector('.row[aria-current="true"]');if(cur)cur.scrollIntoView({block:"nearest"})});
function renderList(){renderChips();const ts=TOWNS.filter(t=>t.city===listCity);
  const sv=sel&&sel.city===listCity;$("gmapList").hidden=!sv;if(sv){$("gmapList").href=gmapURL(sel,true);$("gmapListText").textContent=sel.name+"をGoogleマップで開く"}
  $("lInfo").textContent=`${CITIES[listCity]}　${ts.length}町（覚えた ${ts.filter(learned).length}）　地図か町名をタップ`;
  drawMap($("lMap"),listCity,sel&&sel.city===listCity?Object.assign({},sel,{showName:true}):null,{labels:showLabels,marks:true});
  const l=$("list");l.innerHTML="";[...ts].sort((a,b)=>a.name.localeCompare(b.name,"ja")).forEach(t=>{const r=rec[t.id];const b=document.createElement("button");b.className="row"+(r&&r[0]<2&&r[1]>0?" miss":"");
    b.innerHTML=`<span>${t.name}</span><b>${learned(t)?"✓":r&&r[1]>0?"×"+r[1]:""}</b>`;b.setAttribute("aria-current",sel===t);b.onclick=()=>{sel=t;renderList()};l.appendChild(b)})}

function setMode(m){mode=m;$("nearTog").hidden=m!=="map";store.set("kd-mode",m);["city","map","list"].forEach(k=>$("t-"+k).setAttribute("aria-selected",k===m));
  $("quiz").hidden=m==="list";$("listView").hidden=m!=="list";$("scopeLabel").textContent=m==="list"?"市町を選ぶ":"出題範囲（タップで切替・％は覚えた割合）";
  if(m==="list")renderList();else{renderChips();newQ()}}
$("t-city").onclick=()=>setMode("city");$("t-map").onclick=()=>setMode("map");$("t-list").onclick=()=>setMode("list");
$("next").onclick=newQ;
document.addEventListener("keydown",e=>{if(mode!=="list"&&e.key==="Enter"&&!$("next").hidden&&document.activeElement!==$("next")){newQ()}});
$("reset").onclick=()=>{$("confirmReset").hidden=false};$("no").onclick=()=>{$("confirmReset").hidden=true};
$("yes").onclick=()=>{rec={};store.set("kd-rec",rec);session={n:0,ok:0};$("confirmReset").hidden=true;renderStat();setMode(mode)};
renderStat();setMode(mode);
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
